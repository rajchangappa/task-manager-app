<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task-Manager-App</title>
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="w-full bg-blue-50 px-3 py-4 md:px-4 lg:px-6">
      <h2 class="text-xl font-medium text-blue-400 md:text-2xl">
        Task Manager
      </h2>
    </header>

    <!-- MAIN -->
    <main id="main" class="pb-24">
      <article
        class="mx-4 flex min-h-[70vh] items-center justify-center rounded-xl px-2"
      >
        <h1 class="text-center text-base font-normal text-gray-400 md:text-lg">
          Add a task to display.
        </h1>
      </article>
    </main>

    <!-- FOOTER -->
    <footer
      class="fixed inset-x-0 bottom-0 w-full bg-white px-3 pt-3 pb-8 md:px-4 lg:px-6"
    >
      <form
        id="task-input-form"
        class="mx-auto flex max-w-3xl gap-2 lg:max-w-4xl"
      >
        <input
          autocomplete="off"
          placeholder="Your task..."
          class="min-w-0 flex-1 rounded-xl bg-gray-200 px-3 py-3 text-base font-medium placeholder:text-gray-500 md:px-4 md:text-lg lg:py-4"
          id="task-input-element"
        />
        <button
          type="submit"
          class="shrink-0 cursor-pointer rounded-xl bg-blue-800 px-3 py-3 text-sm font-medium text-white md:px-4 md:text-base lg:px-6 lg:py-4 lg:text-lg"
        >
          Add Task
        </button>
      </form>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
